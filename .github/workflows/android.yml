name: Android Release APK

# Release APKs are built and signed locally with the Tunes key and attached to GitHub Releases.
# This workflow only runs when started by hand (Actions -> Android Release APK -> Run workflow);
# it signs the APK only when the KEYSTORE_* repository secrets are set.
on:
  workflow_dispatch:

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then echo "No signing secrets: building unsigned"; exit 0; fi
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tunes-release.jks
        {
          echo "storeFile=tunes-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: tunes-prod-release
        path: app/build/outputs/apk/prod/release/*.apk
